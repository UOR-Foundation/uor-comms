# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# A row that specifies a public failure declares its error type (R5):
#
#   failure   the error type, as written in `Result<_, E>`
#   negative  the ID of the `build` row whose test provokes the refusal and
#             observes it; this row's own ID when the row is that claim
#
# `cargo xtask audit-limits` lets a shipped crate name an error type in a
# `Result` only when a row here declares it and the negative test exists. A type
# is declared once. Nothing else sanctions a type: there is no list in the gate.
#
# The first rows are this repository's Prism application in `app/`, the room kernel (RK-01 to RK-13).
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "RK-01"
level = "build"
suite = "room"
statement = "An event is admitted only when its address matches, it is signed, its device may sign, its parents are known and it is permitted"

[[id]]
id = "RK-02"
level = "build"
suite = "room"
statement = "Only a joined member with the required power writes, and nobody removes a member of equal or higher power"

[[id]]
id = "RK-03"
level = "build"
suite = "room"
statement = "Candidates for a state key are in a strict total order by rank then address, and the word-by-word comparison of the kernel is that order"

[[id]]
id = "RK-04"
level = "build"
suite = "room"
statement = "The resolved state does not depend on the order or repetition of delivery"

[[id]]
id = "RK-05"
level = "build"
suite = "room"
statement = "A member holds no key from before joining unless history is shared, and none from removal onward"

[[id]]
id = "RK-06"
level = "build"
suite = "room"
statement = "A call connects only through an answer, an ended call stays ended, and the two sides never both yield when calls cross"

[[id]]
id = "RK-07"
level = "build"
suite = "room"
statement = "A permitted ban leaves the member banned, a refused event changes nothing, and only joining makes a member"

[[id]]
id = "RK-08"
level = "build"
suite = "room"
statement = "Equal heads move no bytes and content already held is not requested again"

[[id]]
id = "RK-09"
level = "build"
suite = "room"
statement = "The kernel answers each of its ten questions with the function the theorems are about, and invalid request for anything else"

[[id]]
id = "RK-10"
level = "build"
suite = "room"
statement = "The membership and power of a room are its events folded by one step, the step is the one the kernel answers, and no history takes a status out of range or a power above the creator's"

[[id]]
id = "RK-11"
level = "build"
suite = "room"
statement = "An event's bytes are its words at eight bytes each, decoding returns every word below 2^64 unchanged, a list of addresses has one accepted order with no address twice, and the fields of a laid-out event are read back from its words with nothing left over"

[[id]]
id = "RK-12"
level = "build"
suite = "room"
statement = "An event is composed only when its action is permitted and its form is canonical, the sent event replaces the head it cites, and a send is stored only once signed and announced only once stored"

[[id]]
id = "RK-13"
level = "build"
suite = "room"
statement = "Only a joined member with the power to send redacts, their own event with that alone and another's only with the redaction power; a redacted event shows no content and is not fetched, in whatever order redactions arrive, and a redaction changes no member's status or power"

[[id]]
id = "FR-01"
level = "build"
suite = "frame"
statement = "With a working worker, the page loads and verifies the archive only in that worker before using its identities or guest"

[[id]]
id = "FR-02"
level = "build"
suite = "frame"
statement = "A returning browser whose worker kept an earlier deploy serves this deploy from the navigation that brings its page"

[[id]]
id = "FR-03"
level = "build"
suite = "frame"
statement = "A first visit's bytes are counted once the page has started, the frame's and the app's each within its own budget"

[[id]]
id = "FR-04"
level = "build"
suite = "frame"
statement = "An app's workspace key opens only on a device of the Prism ID that made it, follows the ID when it joins or is recovered, and stays locked on a removed device"

[[id]]
id = "FR-05"
level = "build"
suite = "frame"
statement = "An app's pages on every device of one Prism ID meet on a relay topic only those devices derive, per app, with every message sealed to the ID, and a removed device is left behind"
